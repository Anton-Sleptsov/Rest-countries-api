<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
    <title>Belgium</title>
</head>

<body>
    <div class="wraper">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="header__title">Where in the world?</div>
                    <button class="header__theme">
                        <div class="header__mode-icon">
                            <img src="../images/Dark Mode Icon Container.svg" alt="Dark Mode Icon">
                        </div>
                        <div class="header__mode-text">Dark Mode</div>
                    </button>
                </div>
            </div>
        </header>
        <div class="country">
            <div class="container">

                <button class="country__back">
                    <img class="country__back-icon" src="../images/arrow-left.svg" alt="Back">
                    <span class="country__back-text">Back</span>
                </button>

                <div class="country__content">

                    <div class="country__flag">
                        <img class="country__flag-img" src="../images/Belgium.png" alt="Belgium">
                    </div>

                    <div class="country__info">

                        <h1 class="country__name">Belgium</h1>

                        <div class="country__details">

                            <ul class="country__list">
                                <li class="country__item">
                                    <span class="country__label">Native Name:</span>
                                    <span class="country__value">België</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Population:</span>
                                    <span class="country__value">11,319,511</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Region:</span>
                                    <span class="country__value">Europe</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Sub Region:</span>
                                    <span class="country__value">Western Europe</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Capital:</span>
                                    <span class="country__value">Brussels</span>
                                </li>
                            </ul>

                            <ul class="country__list">
                                <li class="country__item">
                                    <span class="country__label">Top Level Domain:</span>
                                    <span class="country__value">.be</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Currencies:</span>
                                    <span class="country__value">Euro</span>
                                </li>
                                <li class="country__item">
                                    <span class="country__label">Languages:</span>
                                    <span class="country__value">Dutch, French, German</span>
                                </li>
                            </ul>

                        </div>

                        <div class="country__borders">
                            <span class="country__label">Border Countries:</span>

                            <div class="country__border-list">
                                <a class="country__border-item" href="#">France</a>
                                <a class="country__border-item" href="#">Germany</a>
                                <a class="country__border-item" href="#">Netherlands</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
